name: API Small Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Run API Test
        env:
          API_KEYS_POOL: ${{ secrets.API_KEYS_POOL }}
        run: python api_test.py
