name: Daily Fixtures Pre-Fetch

on:
  schedule:
    - cron: '0 1 * * *' # Runs daily at 7:30 AM MMT
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Requests
        run: pip install requests

      - name: Run Fetcher Script
        run: python fetch_data.py

      - name: Commit and Push Updated JSON
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add matches_data.json
          git commit -m "Auto-update matches_data.json [skip ci]" || echo "No changes to commit"
          git push
